- apiVersion: n9/v1alpha
  kind: SLO
  metadata:
    name: replay-source-slo
    project: <PROJECT>-source
  spec:
    description: Source SLO for Replay e2e tests
    service: replay-source-service
    indicator:
      metricSource:
        kind: Direct
        name: replay-direct
        project: <PROJECT>
    timeWindows:
      - count: 1
        isRolling: true
        unit: Hour
    budgetingMethod: Timeslices
    objectives:
      - displayName: Acceptable
        name: acceptable
        op: lte
        rawMetric:
          query:
            newRelic:
              nrql: SELECT average(duration) FROM Transaction TIMESERIES
        target: 0.99
        timeSliceTarget: 0.99
        value: 1.2
      - displayName: Alarming
        name: alarming
        op: lte
        rawMetric:
          query:
            newRelic:
              nrql: SELECT average(duration) FROM Transaction TIMESERIES
