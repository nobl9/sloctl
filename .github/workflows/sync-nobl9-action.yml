name: Sync nobl9-action

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sync-nobl9-action-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    environment: nobl9-action-dispatch
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate official release
        env:
          SLOCTL_SHA: ${{ github.event.workflow_run.head_sha }}
          SLOCTL_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ ! "${SLOCTL_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid official sloctl release tag: ${SLOCTL_TAG}" >&2
            exit 2
          fi
          if [[ ! "${SLOCTL_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid sloctl release SHA: ${SLOCTL_SHA}" >&2
            exit 2
          fi
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.SLOCTL_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.SLOCTL_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: nobl9-action
          permission-actions: write
          permission-checks: read
      - name: Update and publish action
        uses: ./.github/actions/sync-sloctl-release
        with:
          repository: ${{ github.repository_owner }}/nobl9-action
          workflow: update-sloctl.yml
          ref: main
          expected-run-name: sloctl action from release run ${{ github.event.workflow_run.id }}
          sloctl-sha: ${{ github.event.workflow_run.head_sha }}
          sloctl-tag: ${{ github.event.workflow_run.head_branch }}
          source-run-id: ${{ github.event.workflow_run.id }}
          cancel-on-timeout: "false"
          token: ${{ steps.app-token.outputs.token }}
