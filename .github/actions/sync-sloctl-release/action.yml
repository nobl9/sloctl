name: Sync sloctl release
description: Dispatch and monitor a downstream sloctl release update.

inputs:
  repository:
    description: Downstream repository including its owner.
    required: true
  workflow:
    description: Downstream workflow filename.
    required: true
  ref:
    description: Branch containing the downstream workflow.
    required: true
  expected-run-name:
    description: Expected downstream workflow run name.
    required: true
  sloctl-sha:
    description: Commit SHA for the official release.
    required: true
  sloctl-tag:
    description: Official release tag.
    required: true
  source-run-id:
    description: Successful sloctl Release workflow run ID.
    required: true
  token:
    description: GitHub App token with Actions write permission.
    required: true
  cancel-on-timeout:
    description: Cancel the downstream run when monitoring times out.
    default: "true"

runs:
  using: composite
  steps:
    - name: Dispatch and monitor release update
      shell: bash
      env:
        TARGET_REPOSITORY: ${{ inputs.repository }}
        TARGET_WORKFLOW: ${{ inputs.workflow }}
        TARGET_REF: ${{ inputs.ref }}
        EXPECTED_RUN_NAME: ${{ inputs.expected-run-name }}
        GH_TOKEN: ${{ inputs.token }}
        SLOCTL_SHA: ${{ inputs.sloctl-sha }}
        SLOCTL_TAG: ${{ inputs.sloctl-tag }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        CANCEL_ON_TIMEOUT: ${{ inputs.cancel-on-timeout }}
      run: bash "${GITHUB_ACTION_PATH}/sync-sloctl-release.sh"
